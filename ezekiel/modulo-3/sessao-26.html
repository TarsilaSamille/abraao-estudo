<script>
  function setLang(lang){document.documentElement.setAttribute('lang',lang);try{localStorage.setItem('ezekiel-s26-lang',lang);}catch(e){}var pt=document.getElementById('lang-pt'),en=document.getElementById('lang-en');if(lang==='pt'){pt.className="px-3.5 py-1.5 text-sm font-semibold transition-colors bg-slate-800 text-white rounded-l-full";en.className="px-3.5 py-1.5 text-sm font-semibold transition-colors bg-white text-slate-600 hover:bg-slate-50 rounded-r-full";}else{en.className="px-3.5 py-1.5 text-sm font-semibold transition-colors bg-slate-800 text-white rounded-r-full";pt.className="px-3.5 py-1.5 text-sm font-semibold transition-colors bg-white text-slate-600 hover:bg-slate-50 rounded-l-full";}}
  document.addEventListener('DOMContentLoaded',function(){var l;try{l=localStorage.getItem('ezekiel-s26-lang');}catch(e){}if(l=='en'){setLang('en');}});
  const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target);}});},{threshold:0.08});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
