
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" /></meta>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" /></meta>
  <title data-i18n="title">Módulo 2: Da Babilônia para Canaã</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white font-sans text-slate-800">
  <div class="fixed left-4 top-4 z-50">
    <a href="../index.html"
      class="inline-flex items-center gap-2 rounded-full border border-slate-300 bg-white px-4 py-1.5 text-sm font-semibold text-slate-600 shadow-sm transition-colors hover:bg-slate-100">
      <span>←</span><span data-i18n="back">Voltar</span>
    </a>
  </div>
  <div class="fixed right-4 top-4 z-50">
    <div class="inline-flex overflow-hidden rounded-full border border-slate-300 bg-white shadow-sm">
      <button id="lang-pt" onclick="setLang('pt')" class="px-4 py-1.5 text-sm font-semibold transition-colors">PT</button>
      <button id="lang-en" onclick="setLang('en')" class="px-4 py-1.5 text-sm font-semibold transition-colors">EN</button>
    </div>
  </div>
  <div class="min-h-screen p-8">
    <div class="flex min-h-screen flex-col p-8 md:p-12">
      <main class="flex flex-1 flex-col items-center justify-center text-center">
        <img src="../image/img-2.png" alt="Ilustração de vasos com plantas"
          class="mb-8 h-48 w-48 rounded-2xl object-cover shadow-lg" /></img>
        <h1 class="text-5xl font-bold text-slate-900" data-i18n="h1">Módulo 2: Da Babilônia para Canaã</h1>
        <h2 class="mt-4 text-lg font-semibold uppercase tracking-wider text-slate-500" data-i18n="sessions">Sessões 4-10</h2>
        <p class="mt-8 max-w-2xl text-lg text-slate-700" data-i18n="desc">Deus escolhe uma família da dispersão da Babilônia.
            Estude Gênesis 11-14 enquanto Abraão enfrenta seus primeiros testes como o parceiro humano escolhido
            por Deus.</p>

        <div class="mt-12 w-full max-w-3xl">
          <h2 class="mb-6 text-2xl font-bold text-slate-900" data-i18n="toc">Índice de Sessões</h2>
          <div id="sessgrid" class="grid gap-4 md:grid-cols-2"></div>
        </div>
      </main>
    </div>
  </div>
  <script>
    const SESSIONS = [{"n": 4, "title_pt": "Uma História de Duas Jornadas", "title_en": "A Tale of Two Journeys"}, {"n": 5, "title_pt": "Deus Chama Avram e Promete Bênção", "title_en": "God Calls Avram and Promises Blessing"}, {"n": 6, "title_pt": "Avram, a Serpente", "title_en": "Avram, the Serpent"}, {"n": 7, "title_pt": "Avram e Ló se Separam", "title_en": "Avram and Lot Separate"}, {"n": 8, "title_pt": "A Segunda Promessa de Deus a Abrão", "title_en": "God's Second Promise to Abram"}, {"n": 9, "title_pt": "Um Dilúvio de Violência", "title_en": "A Flood of Violence"}, {"n": 10, "title_pt": "Melquisedeque, o Sacerdote Real", "title_en": "Melchizedek, the Royal Priest"}];
    const I18N = {"pt": {"title": "Módulo 2: Da Babilônia para Canaã", "h1": "Módulo 2: Da Babilônia para Canaã", "sessions": "Sessões 4-10", "toc": "Índice de Sessões", "back": "Voltar", "session": "Sessão", "desc": "Deus escolhe uma família da dispersão da Babilônia. Estude Gênesis 11-14 enquanto Abraão enfrenta seus primeiros testes como o parceiro humano escolhido por Deus."}, "en": {"title": "Module 2: From Babylon to Canaan", "h1": "Module 2: From Babylon to Canaan", "sessions": "Sessions 4-10", "toc": "Table of Sessions", "back": "Back", "session": "Session", "desc": "God chooses a family from the dispersion of Babylon. Study Genesis 11-14 as Abraham faces his first tests as God's chosen human partner."}};
    function render(lang){
      document.getElementById('sessgrid').innerHTML = SESSIONS.map(s=>`<a href="sessao-${s.n}.html" class="group block rounded-lg border-2 border-slate-200 p-6 transition-all hover:border-sky-500 hover:shadow-lg"><h3 class="text-xl font-bold text-slate-900 group-hover:text-sky-600">${I18N[lang].session} ${s.n}</h3><p class="mt-2 text-slate-600">${lang==='pt'?s.title_pt:s.title_en}</p></a>`).join('');
    }
    function setLang(lang){
      localStorage.setItem('bp_lang',lang);
      document.documentElement.lang=lang==='pt'?'pt-BR':'en';
      const t=I18N[lang];
      document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(t[k]!==undefined)el.innerHTML=t[k];});
      document.title=t.title;
      const on='bg-sky-600 text-white',off='bg-white text-slate-600 hover:bg-slate-100';
      document.getElementById('lang-pt').className='px-4 py-1.5 text-sm font-semibold transition-colors '+(lang==='pt'?on:off);
      document.getElementById('lang-en').className='px-4 py-1.5 text-sm font-semibold transition-colors '+(lang==='en'?on:off);
      render(lang);
    }
    setLang(localStorage.getItem('bp_lang')||'pt');
  </script>
</body>
</html>
