<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title">Módulo 1: A História do Éden como Introdução à Bíblia Hebraica</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white font-sans text-slate-800">
  <div class="fixed left-4 top-4 z-50">
    <a href="../index.html"
      class="inline-flex items-center gap-2 rounded-full border border-slate-300 bg-white px-4 py-1.5 text-sm font-semibold text-slate-600 shadow-sm transition-colors hover:bg-slate-100">
      <span>&larr;</span><span data-i18n="back">Voltar</span>
    </a>
  </div>
  <div class="fixed right-4 top-4 z-50">
    <div class="inline-flex overflow-hidden rounded-full border border-slate-300 bg-white shadow-sm">
      <button id="lang-pt" onclick="setLang('pt')" class="px-4 py-1.5 text-sm font-semibold transition-colors">PT</button>
      <button id="lang-en" onclick="setLang('en')" class="px-4 py-1.5 text-sm font-semibold transition-colors">EN</button>
    </div>
  </div>
  <div class="min-h-screen p-8">
    <div class="flex min-h-screen flex-col p-8 md:p-12">
      <main class="flex flex-1 flex-col items-center justify-center text-center">
        <img src="../image/img-1.jpeg" alt="A História do Éden como Introdução à Bíblia Hebraica" class="mb-8 h-48 w-48 rounded-2xl object-cover shadow-lg" />
        <h1 class="text-5xl font-bold text-slate-900" data-i18n="h1">Módulo 1: A História do Éden como Introdução à Bíblia Hebraica</h1>
        <h2 class="mt-4 text-lg font-semibold uppercase tracking-wider text-slate-500" data-i18n="sessions">Sessões 1-7</h2>
        <div class="mt-12 w-full max-w-3xl">
          <h2 class="mb-6 text-2xl font-bold text-slate-900" data-i18n="toc">Índice de Sessões</h2>
          <div id="sessgrid" class="grid gap-4 md:grid-cols-2"></div>
        </div>
      </main>
    </div>
  </div>
  <script>
    const SESSIONS = [{"n": 1, "title_pt": "Considerando as Intenções dos Autores para Gênesis", "title_en": "Considering the Authors’ Intentions for Genesis"}, {"n": 2, "title_pt": "Gênesis 2-5 como a Introdução à Bíblia Hebraica", "title_en": "Genesis 2-5 as the Introduction to the Hebrew Bible"}, {"n": 3, "title_pt": "A Diferença Entre Significado e Significância", "title_en": "The Difference Between Meaning and Significance"}, {"n": 4, "title_pt": "Pedaços e Padrões na Narrativa Bíblica", "title_en": "Pieces and Patterns in Biblical Narrative"}, {"n": 5, "title_pt": "O Padrão Cíclico de Gênesis 1-11", "title_en": "The Cyclical Pattern of Genesis 1-11"}, {"n": 6, "title_pt": "O Padrão de Gênesis 1-11 por Toda a Escritura", "title_en": "The Genesis 1-11 Pattern Throughout Scripture"}, {"n": 7, "title_pt": "Refletindo sobre a Macroestrutura de Gênesis 1-11", "title_en": "Reflecting on the Macrostructure of Genesis 1-11"}];
    const I18N = {"pt": {"title": "Módulo 1: A História do Éden como Introdução à Bíblia Hebraica", "h1": "Módulo 1: A História do Éden como Introdução à Bíblia Hebraica", "sessions": "Sessões 1-7", "toc": "Índice de Sessões", "back": "Voltar", "session": "Sessão"}, "en": {"title": "Module 1: The Eden Story as the Introduction to the Hebrew Bible", "h1": "Module 1: The Eden Story as the Introduction to the Hebrew Bible", "sessions": "Sessions 1-7", "toc": "Table of Sessions", "back": "Back", "session": "Session"}};
    function render(lang){
      document.getElementById('sessgrid').innerHTML = SESSIONS.map(s=>`
        <a href="sessao-${s.n}.html"
          class="group block rounded-lg border-2 border-slate-200 p-6 transition-all hover:border-sky-500 hover:shadow-lg">
          <h3 class="text-xl font-bold text-slate-900 group-hover:text-sky-600">${I18N[lang].session} ${s.n}</h3>
          <p class="mt-2 text-slate-600">${lang==='pt'?s.title_pt:s.title_en}</p>
        </a>`).join('');
    }
    function setLang(lang){
      localStorage.setItem('bp_lang',lang);
      document.documentElement.lang=lang==='pt'?'pt-BR':'en';
      const t=I18N[lang];
      document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(t[k]!==undefined)el.innerHTML=t[k];});
      document.title=t.title;
      const on='bg-sky-600 text-white',off='bg-white text-slate-600 hover:bg-slate-100';
      document.getElementById('lang-pt').className='px-4 py-1.5 text-sm font-semibold transition-colors '+(lang==='pt'?on:off);
      document.getElementById('lang-en').className='px-4 py-1.5 text-sm font-semibold transition-colors '+(lang==='en'?on:off);
      render(lang);
    }
    setLang(localStorage.getItem('bp_lang')||'pt');
  </script>
</body>
</html>
