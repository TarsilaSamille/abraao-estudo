<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title">De Noé a Abraão — The Bible Project</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white font-sans text-slate-800">
  <div class="fixed left-4 top-4 z-50">
    <a href="../index.html" class="inline-flex items-center gap-2 rounded-full border border-slate-300 bg-white px-4 py-1.5 text-sm font-semibold text-slate-600 shadow-sm transition-colors hover:bg-slate-100"><span>&larr;</span><span data-i18n="back">Voltar</span></a>
  </div>
  <div class="fixed right-4 top-4 z-50">
    <div class="inline-flex overflow-hidden rounded-full border border-slate-300 bg-white shadow-sm">
      <button id="lang-pt" onclick="setLang('pt')" class="px-4 py-1.5 text-sm font-semibold transition-colors">PT</button>
      <button id="lang-en" onclick="setLang('en')" class="px-4 py-1.5 text-sm font-semibold transition-colors">EN</button>
    </div>
  </div>
  <div class="min-h-screen">
    <div class="flex min-h-screen flex-col items-center justify-center p-8 md:p-12">
      <main class="flex flex-1 flex-col items-center justify-center text-center max-w-5xl w-full">
        <h1 class="text-6xl font-bold text-slate-900 mb-3" data-i18n="h1">De Noé a Abraão</h1>
        <h2 class="text-2xl text-slate-600 mb-2" data-i18n="sub">Noah to Abraham</h2>
        <h3 class="text-lg text-slate-500 mb-6">Gênesis 6-11</h3>
        <p class="max-w-2xl text-lg text-slate-700 leading-relaxed mb-12" data-i18n="desc">Por que Deus escolheu inundar o mundo? A história de Noé e seus descendentes desenvolve temas centrais de toda a narrativa bíblica — da rebelião e julgamento à aliança e bênção que apontam para Abraão.</p>
        <div id="mods" class="grid gap-6 md:grid-cols-2 lg:grid-cols-3 w-full"></div>
      </main>
    </div>
  </div>
  <script>
    const MODS = [
      { n: 0, href: "modulo-0/index.html", pt: "Introdução", en: "Introduction" },
      { n: 1, href: "modulo-1/index.html", pt: "O Dilúvio na Imaginação Bíblica", en: "The Flood in the Biblical Imagination" },
      { n: 2, href: "modulo-2/index.html", pt: "A Rebelião dos Filhos de Deus", en: "The Rebellion of the Sons of God" },
      { n: 3, href: "modulo-3/index.html", pt: "A Arca e o Dilúvio", en: "The Ark and the Flood" },
      { n: 4, href: "modulo-4/index.html", pt: "O Sacrifício e a Aliança de Noé", en: "Noah's Sacrifice and Covenant" },
      { n: 5, href: "modulo-5/index.html", pt: "A Maldição de Cã e Babel", en: "The Curse of Ham and Babel" },
      { n: 6, href: "modulo-6/index.html", pt: "De Sem a Abraão", en: "From Shem to Abraham" },
    ];
    const I18N = {
      pt: { title: "De Noé a Abraão — The Bible Project", h1: "De Noé a Abraão", sub: "Noah to Abraham", desc: "Por que Deus escolheu inundar o mundo? A história de Noé e seus descendentes desenvolve temas centrais de toda a narrativa bíblica — da rebelião e julgamento à aliança e bênção que apontam para Abraão.", back: "Voltar", modules: "Módulos" },
      en: { title: "Noah to Abraham — The Bible Project", h1: "Noah to Abraham", sub: "Noah to Abraham", desc: "Why did God choose to flood the world? The story of Noah and his descendants develops major themes seen throughout the biblical story.", back: "Back", modules: "Modules" }
    };
    function render(lang) {
      document.getElementById("mods").innerHTML = MODS.map(m => `
        <a href="${m.href}" class="group block rounded-xl border-2 border-slate-200 p-6 transition-all hover:-translate-y-1 hover:border-sky-500 hover:shadow-lg">
          <h3 class="text-xl font-bold text-slate-900 group-hover:text-sky-600">${lang === 'pt' ? m.pt : m.en}</h3>
          <p class="mt-1 text-sm text-slate-500">${lang === 'pt' ? 'Módulo ' + m.n : 'Module ' + m.n}</p>
        </a>`).join("");
    }
    function setLang(lang) {
      localStorage.setItem("bp_lang", lang);
      document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
      const t = I18N[lang];
      document.querySelectorAll("[data-i18n]").forEach(el => { const k = el.getAttribute("data-i18n"); if (t[k] !== undefined) el.innerHTML = t[k]; });
      document.title = t.title;
      const on = "bg-sky-600 text-white", off = "bg-white text-slate-600 hover:bg-slate-100";
      document.getElementById("lang-pt").className = "px-4 py-1.5 text-sm font-semibold transition-colors " + (lang === 'pt' ? on : off);
      document.getElementById("lang-en").className = "px-4 py-1.5 text-sm font-semibold transition-colors " + (lang === 'en' ? on : off);
      render(lang);
    }
    setLang(localStorage.getItem("bp_lang") || "pt");
  </script>
</body>
</html>
